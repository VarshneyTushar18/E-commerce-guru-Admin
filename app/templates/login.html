{% extends "base.html" %}
{% block title %}Login — Ecomm Guru Admin{% endblock %}
{% block body %}
<div class="min-h-full flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-orange-500 text-white text-2xl font-bold mb-4">EG</div>
      <h1 class="text-2xl font-bold text-gray-900">Ecomm Guru Admin</h1>
      <p class="text-gray-500 mt-1">AI-powered blog management for ecomm-guru.com</p>
    </div>
    <form method="post" action="/login" class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8 space-y-5">
      {% if error %}
      <div class="bg-red-50 text-red-700 px-4 py-3 rounded-lg text-sm">{{ error }}</div>
      {% endif %}
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="email" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none" placeholder="admin@ecomm-guru.com">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" required class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-orange-500 outline-none">
      </div>
      <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2.5 rounded-lg transition">Sign In</button>
    </form>
  </div>
</div>
{% endblock %}
